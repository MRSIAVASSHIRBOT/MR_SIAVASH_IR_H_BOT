<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --bg:#eef1fb; --card:#fff; --ink:#1b1f3b; --muted:#6b7194; --line:#dde2f5;
    --blue:#3d5afe; --blue-soft:#e4e9ff; --pink:#ff4d8d; --pink-soft:#ffe3ee; --mint:#12b886; --gold:#ffc233;
    --shadow:0 6px 20px rgba(40,55,140,.10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12142a; --card:#1e2142; --ink:#eef0ff; --muted:#9aa0cc; --line:#2e3260;
      --blue:#6f86ff; --blue-soft:#272c63; --pink:#ff6fa3; --pink-soft:#4a2440; --mint:#3ddc9f; --gold:#ffd25e;
      --shadow:0 6px 20px rgba(0,0,0,.35);
      color-scheme: dark;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif; font-size:16px; line-height:1.6; }
  button { font:inherit; color:inherit; cursor:pointer; border:0; background:none; }
  button:disabled { cursor:default; }
  input { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .app { max-width:560px; height:100dvh; margin:0 auto; position:relative; overflow:hidden; display:flex; flex-direction:column; background:var(--bg); }
  @media (min-width:600px) { .app { box-shadow:0 0 60px rgba(40,55,140,.18); } }

  .landing { flex:1; overflow-y:auto; display:flex; flex-direction:column; justify-content:center; padding:26px 22px; gap:16px; }
  .landing.off, .room.off { display:none; }
  .tiles { display:grid; grid-template-columns:repeat(4,46px); gap:6px; width:max-content; }
  .tiles span { height:46px; border-radius:13px; display:grid; place-items:center; font-weight:900; font-size:22px; color:#fff; box-shadow:var(--shadow); }
  .landing h1 { font-size:36px; line-height:1.2; font-weight:900; }
  .landing p { color:var(--muted); }
  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:14px; color:var(--muted); }
  .field input { background:var(--card); border:2px solid var(--line); border-radius:14px; padding:13px 14px; width:100%; }
  .field input:focus { border-color:var(--blue); outline:none; }
  .btn-main { background:var(--blue); color:#fff; font-weight:800; padding:14px; border-radius:14px; box-shadow:var(--shadow); width:100%; }
  .btn-main.alt { background:var(--card); color:var(--ink); }
  .btn-main:active { transform:scale(.98); }
  .btn-main:disabled { opacity:.55; }
  .invited { background:var(--pink-soft); color:var(--pink); font-weight:800; padding:10px 14px; border-radius:14px; display:none; }
  .or { text-align:center; color:var(--muted); font-size:14px; }

  .avatar { width:42px; height:42px; border-radius:14px; background:var(--blue); color:#fff; display:grid; place-items:center; font-weight:900; font-size:15px; flex:none; direction:ltr; position:relative; }
  .avatar::after { content:''; position:absolute; bottom:-2px; inset-inline-end:-2px; width:12px; height:12px; border-radius:50%; background:#fcc419; border:2px solid var(--card); transition:background .2s; }
  .avatar.online::after { background:var(--mint); }
  .avatar.offline::after { background:#e03131; }
  .top .info { flex:1; min-width:0; }

  .top .rt .stat { font-size:11px; font-weight:700; color:var(--muted); padding:1px 8px; border-radius:999px; background:var(--bg); }
  .members { display:flex; gap:4px; overflow:hidden; margin-top:2px; }
  .mem { font-size:12px; padding:1px 8px; border-radius:999px; color:#fff; white-space:nowrap; }
  .invite-btn { background:var(--pink); color:#fff; font-weight:800; padding:9px 14px; border-radius:13px; font-size:14px; box-shadow:var(--shadow); }
  .mute-btn { font-size:20px; padding:6px; border-radius:10px; line-height:1; opacity:.7; }
  .mute-btn.on { opacity:1; }
  .panes { flex:1; min-height:0; position:relative; }
  .pane { position:absolute; inset:0; display:none; flex-direction:column; min-height:0; }
  .pane.on { display:flex; }
  .tabs { display:flex; background:var(--card); padding:6px 10px calc(6px + env(safe-area-inset-bottom)); gap:8px; box-shadow:0 -2px 12px rgba(40,55,140,.08); }
  .tab { flex:1; padding:9px; border-radius:14px; font-weight:800; position:relative; color:var(--muted); }
  .tab.on { background:var(--blue-soft); color:var(--blue); }
  .tab i { position:absolute; top:6px; inset-inline-end:22%; width:11px; height:11px; border-radius:50%; background:var(--mint); display:none; }
  .tab i.on { display:block; }

  .msgs { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:6px; overscroll-behavior:contain; }
  .empty { margin:auto; text-align:center; color:var(--muted); padding:20px; }
  .empty b { display:block; color:var(--ink); font-size:18px; margin-bottom:4px; }
  .msg { max-width:82%; display:flex; flex-direction:column; gap:2px; }
  .msg.me { align-self:flex-start; } .msg.other { align-self:flex-end; }
  .msg .who { font-size:12px; padding:0 6px; font-weight:700; }
  .bubble { padding:9px 13px; border-radius:18px; word-break:break-word; white-space:pre-wrap; background:var(--card); box-shadow:var(--shadow); }
  .me .bubble { background:var(--blue); color:#fff; border-end-start-radius:6px; }
  .other .bubble { border-end-end-radius:6px; }
  .msg .time { font-size:11px; color:var(--muted); padding:0 6px; }
  .sys { align-self:center; background:var(--pink-soft); color:var(--pink); font-size:13px; font-weight:700; padding:5px 14px; border-radius:999px; margin:4px 0; text-align:center; }
  .composer { display:flex; gap:8px; padding:10px 12px; background:var(--card); }
  .composer input { flex:1; background:var(--bg); border:2px solid transparent; border-radius:16px; padding:11px 14px; min-width:0; }
  .composer input:focus { border-color:var(--blue); outline:none; }
  .send { width:48px; border-radius:16px; background:var(--blue); color:#fff; display:grid; place-items:center; }
  .send svg { transform:scaleX(-1); }

  .gscroll { flex:1; overflow-y:auto; padding:14px 14px 22px; overscroll-behavior:contain; }
  .gh2 { font-size:22px; font-weight:900; }
  .ghint { color:var(--muted); font-size:14px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .tile { background:var(--gc,var(--blue)); color:#fff; border-radius:22px; padding:16px 12px; text-align:center; display:flex; flex-direction:column; gap:2px; align-items:center; box-shadow:var(--shadow); min-height:122px; justify-content:center; }
  .tile:active { transform:scale(.96); }
  .tile .ti { font-size:34px; line-height:1.15; }
  .tile b { font-weight:900; font-size:17px; }
  .tile small { font-size:12px; opacity:.9; }
  .ghead { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .gtitle { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:900; }
  .gtitle span { width:40px; height:40px; border-radius:13px; background:var(--gc); display:grid; place-items:center; font-size:22px; }
  .link { color:var(--blue); font-size:14px; font-weight:800; padding:6px 4px; }
  .prow { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .pl { flex:1; min-width:96px; background:var(--card); border-radius:16px; padding:7px 10px; display:flex; align-items:center; gap:8px; border:2px solid transparent; }
  .pl.turn { border-color:var(--mint); }
  .pl.gone { opacity:.45; }
  .pl .sym { font-weight:900; font-size:21px; width:26px; text-align:center; }
  .pl .nm { font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl .pt { margin-inline-start:auto; font-weight:900; color:var(--muted); font-size:14px; }
  .status { text-align:center; font-weight:800; margin-bottom:12px; min-height:28px; }
  .status.good { color:var(--mint); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .chip { background:var(--card); border-radius:999px; padding:5px 14px; font-weight:800; box-shadow:var(--shadow); }
  .btn-sm { background:var(--blue); color:#fff; font-weight:800; padding:11px 22px; border-radius:14px; }
  .btn-sm.alt { background:var(--card); color:var(--ink); box-shadow:var(--shadow); }
  .btn-sm.pink { background:var(--pink); } .btn-sm.mint { background:var(--mint); color:#06281d; }
  .btn-sm:disabled { opacity:.5; }
  .btn-row { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .over { background:var(--card); border-radius:20px; padding:14px; text-align:center; margin-top:14px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; }
  .over .ot { font-size:22px; font-weight:900; }
  .over .on { color:var(--muted); font-size:14px; }

  .b3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-width:320px; margin:0 auto; direction:ltr; }
  .cell { aspect-ratio:1; border-radius:18px; background:var(--card); box-shadow:var(--shadow); font-size:46px; font-weight:900; display:grid; place-items:center; line-height:1; }
  .cell.x { color:var(--blue); } .cell.o { color:var(--pink); }
  .cell.win { background:var(--blue-soft); outline:3px solid var(--mint); }
  .cell:not(:disabled):active { transform:scale(.94); }

  .c4 { display:grid; grid-template-columns:repeat(7,1fr); gap:5px; direction:ltr; background:var(--blue); padding:8px; border-radius:18px; box-shadow:var(--shadow); max-width:380px; margin:0 auto; }
  .col { display:flex; flex-direction:column; gap:5px; border-radius:10px; padding:0; }
  .col:not(:disabled):active { background:rgba(255,255,255,.18); }
  .coin { aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,.2); display:block; width:100%; }
  .coin.p1 { background:var(--pink); } .coin.p2 { background:var(--gold); }
  .coin.win { outline:3px solid #fff; }
  .dot1,.dot2 { display:inline-block; width:14px; height:14px; border-radius:50%; }
  .dot1 { background:var(--pink); } .dot2 { background:var(--gold); }

  .rps-row { display:flex; gap:10px; justify-content:center; margin-bottom:12px; }
  .rps-btn { flex:1; max-width:104px; background:var(--card); border-radius:20px; padding:14px 4px; font-size:38px; box-shadow:var(--shadow); line-height:1.1; }
  .rps-btn:active { transform:scale(.94); }
  .reveal { display:flex; justify-content:center; gap:14px; margin-bottom:12px; }
  .rv { background:var(--card); border-radius:20px; padding:12px 16px; text-align:center; min-width:110px; box-shadow:var(--shadow); }
  .rv .big { font-size:48px; line-height:1.2; } .rv .nm { font-size:13px; color:var(--muted); }
  .rv.w { outline:3px solid var(--mint); }

  .gform { display:flex; gap:8px; margin:10px 0; }
  .gform input { flex:1; min-width:0; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:11px 14px; text-align:center; font-size:18px; font-weight:800; }
  .gform input:focus { border-color:var(--blue); outline:none; }
  .range { text-align:center; font-size:18px; font-weight:900; margin:4px 0 10px; }
  .log { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .log div { background:var(--card); border-radius:12px; padding:6px 12px; font-size:14px; display:flex; justify-content:space-between; gap:8px; }

  .mem4 { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:340px; margin:0 auto; }
  .mc { aspect-ratio:1; border-radius:16px; background:var(--gc); color:#fff; font-size:32px; display:grid; place-items:center; box-shadow:var(--shadow); }
  .mc.up { background:var(--card); color:inherit; outline:3px solid var(--gc); }
  .mc.done { background:var(--card); color:inherit; opacity:.55; }
  .mc:not(:disabled):active { transform:scale(.94); }

  .pad { width:100%; border-radius:26px; min-height:200px; display:grid; place-items:center; text-align:center; font-weight:900; font-size:26px; color:#fff; padding:16px; box-shadow:var(--shadow); user-select:none; touch-action:manipulation; }
  .pad.wait { background:#e03131; } .pad.go { background:var(--mint); color:#06281d; } .pad.res { background:var(--card); color:var(--ink); font-size:16px; }
  .pad.tapbtn { background:var(--gc); min-height:180px; font-size:34px; }
  .pad.tapbtn:active { transform:scale(.98); }
  .pad small { display:block; font-size:15px; font-weight:700; opacity:.9; }
  .big-n { font-size:56px; line-height:1.1; }
  .tbars { display:flex; flex-direction:column; gap:7px; margin-top:12px; }
  .tb { background:var(--card); border-radius:12px; overflow:hidden; position:relative; height:34px; }
  .tb i { position:absolute; inset-block:0; inset-inline-start:0; background:var(--gc); opacity:.28; width:0; transition:width .25s; }
  .tb span { position:relative; display:flex; justify-content:space-between; padding:5px 12px; font-weight:800; font-size:14px; }
  .rtab { width:100%; margin-top:6px; display:flex; flex-direction:column; gap:6px; text-align:start; }
  .rtab div { display:flex; justify-content:space-between; background:var(--bg); border-radius:10px; padding:4px 12px; font-size:15px; font-weight:700; }
  .rtab div.w { outline:2px solid var(--mint); }

  .qbox { background:var(--card); border-radius:20px; padding:16px; font-weight:900; font-size:19px; text-align:center; box-shadow:var(--shadow); margin-bottom:12px; }
  .qinfo { display:flex; justify-content:space-between; font-weight:800; color:var(--muted); font-size:14px; margin-bottom:6px; }
  .bar { height:8px; border-radius:6px; background:var(--line); overflow:hidden; margin-bottom:12px; }
  .bar i { display:block; height:100%; width:100%; background:var(--gc); transition:width .25s linear; }
  .opts { display:grid; gap:8px; }
  .opt { background:var(--card); border-radius:16px; padding:13px 14px; font-weight:800; box-shadow:var(--shadow); text-align:start; border:2px solid transparent; }
  .opt:not(:disabled):active { transform:scale(.98); }
  .opt.sel { border-color:var(--blue); background:var(--blue-soft); }
  .opt.ok { border-color:var(--mint); background:var(--mint); color:#06281d; }
  .opt.bad { border-color:var(--pink); background:var(--pink-soft); }

  .draw-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; font-weight:900; }
  .word { font-size:20px; letter-spacing:3px; }
  .tmr { background:var(--card); border-radius:999px; padding:2px 12px; font-weight:900; min-width:48px; text-align:center; direction:ltr; display:inline-block; }
  .cvwrap { background:#fff; border-radius:18px; overflow:hidden; box-shadow:var(--shadow); touch-action:none; line-height:0; }
  .cvwrap canvas { width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; }
  .tools { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  .sw { width:30px; height:30px; border-radius:50%; border:3px solid var(--card); box-shadow:0 0 0 2px var(--line); }
  .sw.on { box-shadow:0 0 0 3px var(--ink); }
  .feed { display:flex; flex-direction:column; gap:4px; margin-top:8px; font-size:14px; }
  .feed div { background:var(--card); border-radius:10px; padding:4px 12px; }
  .feed .ok { background:var(--mint); color:#06281d; font-weight:800; }

  .spin { background:var(--card); border-radius:26px; padding:22px 14px; text-align:center; box-shadow:var(--shadow); margin-bottom:14px; }
  .spin .big { font-size:30px; font-weight:900; min-height:48px; }
  .spin .sub { color:var(--muted); font-size:14px; }
  .card2 { background:var(--gc); color:#fff; border-radius:22px; padding:20px 16px; text-align:center; font-weight:800; font-size:19px; box-shadow:var(--shadow); margin-bottom:12px; }
  .card2 small { display:block; font-size:13px; opacity:.9; margin-bottom:6px; }

  .sheet { position:absolute; inset:0; z-index:8; background:rgba(10,12,40,.5); display:none; align-items:flex-end; }
  .sheet.on { display:flex; }
  .sheet .box { width:100%; background:var(--bg); border-radius:26px 26px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; max-height:92dvh; overflow-y:auto; }
  .code { text-align:center; font-size:38px; font-weight:900; letter-spacing:6px; direction:ltr; color:var(--blue); }
  .linkbox { background:var(--card); border:2px dashed var(--line); border-radius:14px; padding:10px 12px; font-size:13px; direction:ltr; word-break:break-all; color:var(--muted); }
  .qrwrap { display:flex; justify-content:center; padding:8px; }
  .qrwrap img { width:180px; height:180px; border-radius:16px; background:#fff; padding:8px; box-shadow:var(--shadow); }

  .toast { position:absolute; top:84px; left:50%; transform:translateX(-50%); z-index:20; background:var(--ink); color:var(--bg); padding:8px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90%; text-align:center; }
  .toast.on { opacity:1; }
  @media (prefers-reduced-motion: reduce) { .tb i, .bar i, .toast { transition:none; } }
</style>
</head>
<body>
<div class="app">

  <section class="landing" id="landing">
    <div class="tiles" aria-hidden="true">
      <span style="background:#3d5afe">X</span><span style="background:#ff4d8d">O</span><span style="background:#12b886">✊</span><span style="background:#ff922b">🎨</span>
    </div>
    <h1>چت‌بازی</h1>
    <p>با دوستت چت کن و وسط گفتگو بازی کنید. ۱۰ بازی مختلف آماده‌ست.</p>
    <div class="invited" id="invited"></div>
    <div class="field">
      <label for="inName">اسم تو</label>
      <input id="inName" maxlength="14" autocomplete="off" placeholder="مثلاً سیاوش">
    </div>
    <button class="btn-main" id="btnCreate">ساخت اتاق جدید</button>
    <div class="or">یا</div>
    <div class="field">
      <label for="inCode">کد اتاق (یا لینک دعوت)</label>
      <input id="inCode" autocomplete="off" placeholder="مثلاً k7m2x" dir="ltr" style="text-align:center">
    </div>
    <button class="btn-main alt" id="btnJoin">ورود به اتاق</button>
    <div class="note">تو اتاق رو می‌سازی، لینک دعوت رو برای دوستت می‌فرستی، اون هم با یه کلیک وارد می‌شه. نیازی به ثبت‌نام نیست.</div>
  </section>

  <section class="room off" id="room">
    <header class="top">
      <div class="avatar" id="avatar">…</div>
      <div class="info">
        <div class="rt">اتاق <span id="rcode"></span> <span class="stat" id="stat">در حال اتصال…</span></div>
        <div class="members" id="members"></div>
      </div>
      <button class="mute-btn on" id="btnMute" title="صدا" aria-label="صدا">🔊</button>
      <button class="invite-btn" id="btnInvite">دعوت</button>
    </header>
    <div class="panes">
      <div class="pane on" id="paneChat">
        <div class="msgs" id="msgs" aria-live="polite"></div>

function createEngine(hooks) {
  let game = null;
  const ctx = {
    later(ms, fn) { const gid = game && game.id; setTimeout(() => { if (game && game.id === gid) { fn(game); hooks.emit(game); } }, ms); },
    raw(m) { hooks.raw(m); }

  function begin(players, score) {
    const T = G[game.type];
    const ng = { id: Date.now() + rnd(100000), type: game.type, phase: 'play', players: players.slice(), starter: game.starter, score: score || {}, gone: [], winners: null, note: '', min: T.min, max: T.max };
    game = ng; T.init(ng, ctx); hooks.emit(game);
  }
  const E = {};
  E.getGame = () => game;
  E.act = (from, a) => {
    if (!a || typeof a.t !== 'string') return;
    const t = a.t;
    if (t === 'open') {
      const T = G[a.type]; if (!T) return;
      if (game && game.phase === 'play') return hooks.toast(from, 'یه بازی در جریانه');
      if (game && game.phase === 'lobby' && game.starter !== from) return hooks.toast(from, 'یه بازی منتظر بازیکنه؛ بپیوند');
      game = { id: Date.now() + rnd(100000), type: a.type, phase: 'lobby', players: [from], starter: from, score: {}, gone: [], min: T.min, max: T.max };
      hooks.sys(from + ' بازی «' + T.name + '» رو شروع کرد؛ بپیوند! 🎮');
      return hooks.emit(game);
    }
    if (!game) return;
    if (t === 'join') {
      if (game.phase !== 'lobby' || game.players.includes(from) || game.players.length >= game.max) return;
      game.players.push(from);
      if (game.players.length >= game.max) return begin(game.players, {});
      return hooks.emit(game);
    }
    if (t === 'begin') {
      if (game.phase !== 'lobby' || from !== game.starter || game.players.length < game.min) return;
      return begin(game.players, {});
    }
    if (t === 'close') {
      if (from === game.starter || (game.phase === 'over' && game.players.includes(from))) { game = null; hooks.emit(null); }
      return;
    }
    if (t === 'again') {

    G[game.type].act(game, a, from, ctx);

      return hooks.emit(game);
    }
    if (!game.players.includes(name) || game.gone.includes(name)) return;
    game.gone.push(name);
    const act = activeOf(game);
    if (!act.length) { game = null; return hooks.emit(null); }
    if (game.phase === 'play') {
      if (act.length < game.min) finish(game, act, name + ' بازی رو ترک کرد');
      else if (G[game.type].onLeave) G[game.type].onLeave(game, name, ctx);
    }
    hooks.emit(game);
  };
  return E;
}

  const palette = ['#1b1f3b', '#e03131', '#ff922b', '#fcc419', '#12b886', '#3d5afe', '#9c36b5', '#ffffff'];
  gb.innerHTML = head(g, T)
    + (g.phase === 'over' ? '' : `<div class="draw-top"><span>${g.drawer === me ? 'تو نقاشی: ' : esc(g.drawer) + ' می‌کشه: '}<span class="word">${wordTxt}</span></span>${g.stage === 'draw' ? `<span class="tmr" data-end="${sinceOf(key) + g.dur * 1000}">${fa(g.dur)}</span>` : '<span class="tmr">⏱</span>'}</div>`)
    + '<div class="cvwrap" id="cvSlot"></div>'
    + (isDrawer ? `<div class="tools">${palette.map(c => `<button class="sw ${pen.c === c ? 'on' : ''}" data-pen="${c}" style="background:${c}" aria-label="رنگ"></button>`).join('')}<button class="btn-sm alt" data-pen-w="${pen.w > 5 ? 5 : 14}">${pen.w > 5 ? 'قلم نازک' : 'قلم ضخیم'}</button><button class="btn-sm alt" data-act="${ja({ t: 'clear' })}">پاک‌کن همه</button></div>` : '')
    + (g.stage === 'draw' && g.drawer !== me && g.players.includes(me) && !guessed ? '<div id="gslot"></div>' : '')
    + (guessed ? '<div class="status good">درست حدس زدی! 🎉</div>' : '')
    + (g.stage === 'reveal' ? `<div class="status">کلمه «${esc(g.word)}» بود</div>` : '')
    + `<div class="feed">${(g.feed || []).slice().reverse().map(f => f.ok ? `<div class="ok">✅ ${esc(f.p)} درست حدس زد</div>` : `<div><b>${esc(f.p)}:</b> ${esc(f.t)}</div>`).join('')}</div>`
    + scoreRow(g, g.pts, g.stage === 'draw' ? g.drawer : null, ' امتیاز') + overBox(g);
  $('cvSlot').appendChild(cv);
  const gs = $('gslot'); if (gs) gs.appendChild(gin);
  gb.querySelectorAll('[data-pen]').forEach(b => { b.onclick = () => { pen.c = b.dataset.pen; renderGame(); }; });
  gb.querySelectorAll('[data-pen-w]').forEach(b => { b.onclick = () => { pen.w = +b.dataset.penW; renderGame(); }; });
};

let spinIv = null;
function stopSpin() { if (spinIv) { clearInterval(spinIv); spinIv = null; } }
VIEW.td = (g, T) => {
  const inG = g.players.includes(me);
  let main = '';
  if (g.stage === 'idle') main = `<div class="spin"><div class="big">🍾</div><div class="sub">برای انتخاب یه نفر بچرخون</div></div><div class="btn-row"><button class="btn-sm pink" data-act="${ja({ t: 'spin' })}" ${inG ? '' : 'disabled'}>بچرخون!</button></div>`;
  else if (g.stage === 'spin') main = '<div class="spin"><div class="big" id="spinName">…</div><div class="sub">در حال چرخیدن…</div></div>';
  else if (g.stage === 'choose') main = `<div class="spin"><div class="big" style="color:${colorOf(g.target)}">${esc(g.target)}</div><div class="sub">${g.target === me ? 'نوبت توئه! انتخاب کن' : 'منتظر انتخاب ' + esc(g.target)}</div></div>
    ${g.target === me ? `<div class="btn-row"><button class="btn-sm" data-act="${ja({ t: 'choose', c: 'truth' })}">حقیقت 🙊</button><button class="btn-sm pink" data-act="${ja({ t: 'choose', c: 'dare' })}">جرأت 🔥</button></div>` : ''}`;
  else if (g.stage === 'shown' && g.card) main = `<div class="spin"><div class="big" style="color:${colorOf(g.target)};font-size:24px">${esc(g.target)}</div></div>
    <div class="card2" style="--gc:${g.card.c === 'truth' ? '#3d5afe' : '#c2255c'}"><small>${g.card.c === 'truth' ? 'حقیقت 🙊' : 'جرأت 🔥'}</small>${esc(g.card.text)}</div>
    <div class="btn-row">${g.target === me ? `<button class="btn-sm alt" data-act="${ja({ t: 'reroll' })}">یکی دیگه</button>` : ''}<button class="btn-sm pink" data-act="${ja({ t: 'spin' })}" ${inG ? '' : 'disabled'}>نفر بعدی</button></div>`;
  gb.innerHTML = head(g, T) + main;
  if (g.stage === 'spin') {
    const el = $('spinName'); const names = g.players;
    spinIv = setInterval(() => { el.textContent = names[rnd(names.length)]; }, 90);
  }
};

try {

    name: 'چت‌بازی',

    start_url: '.',
    display: 'standalone',
    background_color: '#eef1fb',
    theme_color: '#3d5afe',
    lang: 'fa',
    dir: 'rtl',
    icons: [{
      src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233d5afe'/><text x='50' y='50' font-size='60' text-anchor='middle' dominant-baseline='central' font-family='sans-serif' font-weight='900' fill='%23fff'>چ</text></svg>",
      sizes: 'any', type: 'image/svg+xml', purpose: 'any maskable'
    }]
  };
  const blob = new Blob([JSON.stringify(mf)], { type: 'application/json' });
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
} catch(e) {}

})();
